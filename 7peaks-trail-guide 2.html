<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#141210;--surface:#1e1b18;--border:rgba(196,180,154,0.1);--dust:#8b7f72;--sand:#c4b49a;--snow:#f0ece6;--summit:#e8522a;--sky:#4a8fa8;--pine:#3d6b4f;--nav-h:60px}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--snow)}
.topbar{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:rgba(20,18,16,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:1000}
.topbar-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--snow);flex:1}
.topbar-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--dust);letter-spacing:.1em}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(20,18,16,0.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;z-index:1000}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;border:none;background:none;color:var(--dust);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;transition:color .2s;-webkit-tap-highlight-color:transparent}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}
.nav-btn.active{color:var(--summit)}
.page{position:fixed;top:var(--nav-h);left:0;right:0;bottom:64px;overflow-y:auto;overflow-x:hidden;display:none;-webkit-overflow-scrolling:touch}
.page.active{display:block}
#map-page{display:none}
#map-page.active{display:block;overflow:hidden}
.summary-banner{background:linear-gradient(135deg,rgba(232,82,42,.08),rgba(74,143,168,.05));border-bottom:1px solid var(--border);padding:20px 16px;display:flex;justify-content:space-around}
.s-stat{text-align:center}
.s-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--sand)}
.s-lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--dust);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.day-item{display:flex;align-items:stretch;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;-webkit-tap-highlight-color:transparent}

.day-num-col{width:60px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:36px;color:rgba(139,127,114,.25);flex-shrink:0;padding:20px 0}
.day-info{flex:1;padding:18px 16px 18px 8px}
.day-label-sm{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.18em;color:var(--dust);text-transform:uppercase;margin-bottom:4px}
.day-name{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:var(--sand);margin-bottom:8px}
.tag-row{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.08em;padding:3px 8px;border-radius:2px;text-transform:uppercase}

.info-card{background:rgba(74,143,168,.08);border:1px solid rgba(74,143,168,.2);border-radius:4px;padding:12px 14px;margin-bottom:10px}

<script>
// ── TILE CACHING SYSTEM ──────────────────────────────────
// Uses a hidden canvas to force-load tiles into browser cache
// Works best on WiFi — open each trail page or hit "Download All"
 
const TILE_URL = 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png';
const TILE_SERVERS = ['a','b','c'];
 
function lon2tile(lon,zoom){return Math.floor((lon+180)/360*Math.pow(2,zoom))}
function lat2tile(lat,zoom){return Math.floor((1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*Math.pow(2,zoom))}
 
function getTilesForRoute(route, zooms){
  const tiles=new Set();
  zooms.forEach(z=>{
    // Get bounding box of route with padding
    const lats=route.map(r=>r[0]), lngs=route.map(r=>r[1]);
    const minLat=Math.min(...lats)-0.02, maxLat=Math.max(...lats)+0.02;
    const minLng=Math.min(...lngs)-0.02, maxLng=Math.max(...lngs)+0.02;
    const xMin=lon2tile(minLng,z), xMax=lon2tile(maxLng,z);
    const yMin=lat2tile(maxLat,z), yMax=lat2tile(minLat,z);
    for(let x=xMin;x<=xMax;x++){
      for(let y=yMin;y<=yMax;y++){
        const s=TILE_SERVERS[Math.abs(x+y)%3];
        tiles.add(TILE_URL.replace('{s}',s).replace('{z}',z).replace('{x}',x).replace('{y}',y));
      }
    }
  });
  return [...tiles];
}
 
async function cacheTiles(urls, onProgress){
  let done=0;
  const batch=10;
  for(let i=0;i<urls.length;i+=batch){
    const chunk=urls.slice(i,i+batch);
    await Promise.all(chunk.map(url=>
      fetch(url,{mode:'no-cors',cache:'force-cache'}).catch(()=>{})
    ));
    done+=chunk.length;
    if(onProgress) onProgress(done/urls.length);
    await new Promise(r=>setTimeout(r,50));
  }
}
 
const cachedPeaks = JSON.parse(localStorage.getItem('cached_peaks')||'[]');
 
async function cacheTrail(peakId, onProgress){
  const p = PEAKS[peakId];
  // Zoom levels: 11=overview, 13=trail overview, 15=detail, 16=close detail
  const tiles = getTilesForRoute(p.route, [11,13,15,16]);
  await cacheTiles(tiles, onProgress);
  if(!cachedPeaks.includes(peakId)){
    cachedPeaks.push(peakId);
    localStorage.setItem('cached_peaks', JSON.stringify(cachedPeaks));
  }
}
 
async function cacheAllTrails(){
  const btn = document.getElementById('cache-all-btn');
  btn.textContent = '⏳ Downloading...';
  btn.disabled = true;
  for(let i=0;i<PEAKS.length;i++){
    btn.textContent = `⏳ ${i+1}/6 trails...`;
    await cacheTrail(i);
  }
  btn.textContent = '✓ All Downloaded';
  btn.className = 'cache-all-btn done';
  btn.disabled = false;
}

// ── APP ───────────────────────────────────────────────────
let currentPage='list', mainMap=null, detailMaps={};
let completed=JSON.parse(localStorage.getItem('peaks_done')||'[]');
 
function renderList(){
  const list=document.getElementById('day-list');
  list.innerHTML='';
  PEAKS.forEach(p=>{
    const done=completed.includes(p.id);
    const cached=cachedPeaks.includes(p.id);
    const div=document.createElement('div');
    div.className='day-item';
    div.onclick=()=>showDetail(p.id);
    div.innerHTML=`
      <div class="day-num-col" style="${done?'color:rgba(61,107,79,.6)':''}">${String(p.dayNum).padStart(2,'0')}</div>
      <div class="day-info">
        <div class="day-label-sm">${p.day}${done?' · ✓ Done':''}${cached?' · 📥 Cached':''}</div>
        <div class="day-name" style="${done?'color:var(--pine)':''}">${p.name}</div>
        <div class="tag-row">
          <span class="tag tag-mi">${p.miles} mi</span>
          <span class="tag tag-elev">${p.summitElev.toLocaleString()} ft</span>
          <span class="tag tag-time">${p.start}</span>
          ${p.scramble?'<span class="tag tag-hard">⚡ Scramble</span>':''}
        </div>
      </div>
      <div class="day-chevron">›</div>`;
    list.appendChild(div);
  });
  document.getElementById('progress-mini').textContent=completed.length+'/7';
}
 
function showDetail(id){
  const p=PEAKS[id];
  const done=completed.includes(p.id);
  const cached=cachedPeaks.includes(p.id);
  const page=document.getElementById('detail-page');
  const aHtml=p.alerts.map(a=>`
    <div class="${a.type==='warn'?'alert-card':'info-card'}">
      <div class="${a.type==='warn'?'alert-title':'info-title'}">${a.title}</div>
      <div class="${a.type==='warn'?'alert-body':'info-body'}">${a.body}</div>
    </div>`).join('');
  const wHtml=p.waypoints.map(w=>`
    <div class="waypoint">
      <div class="wp-dot ${w.type}">${w.type==='start'?'🚗':w.type==='summit'?'🏔':w.type==='end'?'🅿':'📍'}</div>
      <div class="wp-info">
        <div class="wp-name">${w.label}</div>
        <div class="wp-elev">${w.elev}</div>
        <div class="wp-coords" onclick="copyCoords(${w.lat},${w.lng})">📋 ${w.lat.toFixed(4)}, ${w.lng.toFixed(4)}</div>
        <div class="wp-note">${w.note}</div>
      </div>
    </div>`).join('');
  const apple=`https://maps.apple.com/?daddr=${p.trailhead.lat},${p.trailhead.lng}&dirflg=d`;
  const google=`https://www.google.com/maps/dir/?api=1&destination=${p.trailhead.lat},${p.trailhead.lng}&travelmode=driving`;
  page.innerHTML=`
    <div class="detail-header">
      <div class="detail-back" onclick="backToList()">‹ All Days</div>
      <div class="detail-day-lbl">Day ${p.dayNum} · ${p.day}</div>
      <div class="detail-peak-name">${p.name}</div>
      <div class="detail-tags">
        <span class="tag tag-mi">${p.miles} mi</span>
        <span class="tag tag-elev">${p.elevGain.toLocaleString()} ft gain</span>
        <span class="tag tag-time">${p.start} start</span>
        <span class="tag tag-elev">Summit: ${p.summitElev.toLocaleString()} ft</span>
        ${p.scramble?'<span class="tag tag-hard">⚡ Scramble</span>':''}
      </div>
    </div>
    <div class="status-toggle" onclick="toggleDone(${p.id})">
      <div class="status-check ${done?'done':''}">${done?'✓':''}</div>
      <div class="status-text">${done?'Summited! ✓':'Mark as completed'}<small>${done?'Tap to unmark':'Tap after you summit'}</small></div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">
        <span>Trail Map ${cached?'· 📥 Cached':''}</span>
        <button class="cache-btn ${cached?'cached':''}" id="cache-btn-${p.id}" onclick="cacheOne(${p.id})">${cached?'✓ Saved':'⬇ Save Offline'}</button>
      </div>
      <div class="mini-map" id="detail-map-${p.id}">
        <div class="cache-progress"><div class="cache-progress-fill" id="prog-${p.id}"></div></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <a href="${apple}" class="open-maps-btn" style="flex:1">🗺 Apple Maps</a>
        <a href="${google}" class="open-maps-btn" style="flex:1">📍 Google Maps</a>
      </div>
    </div>
    <div class="detail-section"><div class="detail-section-title">Important Notes</div>${aHtml}</div>
    <div class="detail-section">
      <div class="detail-section-title">Waypoints · Tap coords to copy</div>
      <div class="waypoint-list">${wHtml}</div>
    </div>
    <div class="detail-section" style="border-bottom:none">
      <a href="${p.alltrails}" class="open-maps-btn" target="_blank">↗ View on AllTrails</a>
    </div>`;
  showPage('detail');
  setTimeout(()=>initDetailMap(p), 120);
}
 
async function cacheOne(id){
  const btn=document.getElementById(`cache-btn-${id}`);
  const prog=document.getElementById(`prog-${id}`);
  btn.textContent='⏳ Saving...';
  btn.disabled=true;
  await cacheTrail(id, pct=>{
    if(prog) prog.style.width=(pct*100)+'%';
  });
  btn.textContent='✓ Saved';
  btn.className='cache-btn cached';
  btn.disabled=false;
  if(prog) prog.style.width='100%';
  renderList();
}
 
function initDetailMap(p){
  const el=document.getElementById(`detail-map-${p.id}`);
  if(!el||detailMaps[p.id]) return;
  const lats=p.route.map(r=>r[0]),lngs=p.route.map(r=>r[1]);
  const m=L.map(el,{zoomControl:true,attributionControl:false})
    .fitBounds([[Math.min(...lats),Math.min(...lngs)],[Math.max(...lats),Math.max(...lngs)]],{padding:[28,28]});
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,opacity:.9}).addTo(m);
  L.polyline(p.route,{color:'rgba(232,82,42,.25)',weight:14,opacity:.6,lineCap:'round',lineJoin:'round'}).addTo(m);
  L.polyline(p.route,{color:'#ff6b3d',weight:4,opacity:.95,lineCap:'round',lineJoin:'round'}).addTo(m);
  const thIcon=L.divIcon({html:'<div style="background:#3d6b4f;width:14px;height:14px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.7)"></div>',className:'',iconSize:[14,14],iconAnchor:[7,7]});
  L.marker([p.trailhead.lat,p.trailhead.lng],{icon:thIcon}).addTo(m).bindPopup(`<b>Trailhead</b><br><small>${p.trailhead.label}</small>`);
  const sIcon=L.divIcon({html:'<div style="background:#e8522a;width:18px;height:18px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 10px rgba(232,82,42,.8)"></div>',className:'',iconSize:[18,18],iconAnchor:[9,9]});
  L.marker([p.summit.lat,p.summit.lng],{icon:sIcon}).addTo(m).bindPopup(`<b>${p.name} Summit</b><br><small>${p.summitElev.toLocaleString()} ft</small>`);
  if(p.id===3){
    const eIcon=L.divIcon({html:'<div style="background:#4a8fa8;width:14px;height:14px;border-radius:3px;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.7)"></div>',className:'',iconSize:[14,14],iconAnchor:[7,7]});
    L.marker([40.2424,-111.5777],{icon:eIcon}).addTo(m).bindPopup('<b>Shuttle Car TH</b><br><small>40.2424, -111.5777</small>');
  }
  detailMaps[p.id]=m;
}
 
function initMainMap(){
  if(mainMap) return;
  mainMap=L.map('main-map',{zoomControl:true,attributionControl:true}).setView([40.10,-111.65],10);
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap'}).addTo(mainMap);
  PEAKS.forEach(p=>{
    const done=completed.includes(p.id);
    L.polyline(p.route,{color:done?'rgba(61,107,79,.6)':'rgba(232,82,42,.5)',weight:3,opacity:.9,lineCap:'round'}).addTo(mainMap);
    const icon=L.divIcon({html:`<div style="background:${done?'#3d6b4f':'#e8522a'};width:34px;height:34px;border-radius:50%;border:2.5px solid #f0ece6;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:14px;color:#fff;box-shadow:0 2px 14px rgba(${done?'61,107,79':'232,82,42'},.7)">${p.dayNum}</div>`,className:'',iconSize:[34,34],iconAnchor:[17,17]});
    L.marker([p.summit.lat,p.summit.lng],{icon}).addTo(mainMap)
      .bindPopup(`<div class="popup-day">Day ${p.dayNum} · ${p.day}</div><div class="popup-name">${p.name}</div><div class="popup-info">${p.miles} mi · ${p.summitElev.toLocaleString()} ft · ${p.start}</div><a class="popup-btn" onclick="showDetail(${p.id});return false">View Route →</a>`);
    L.circleMarker([p.trailhead.lat,p.trailhead.lng],{radius:5,color:'#4a8fa8',fillColor:'#4a8fa8',fillOpacity:.9,weight:1.5}).addTo(mainMap)
      .bindPopup(`<div class="popup-day">TH · ${p.name}</div><div class="popup-info">${p.trailhead.label}</div>`);
  });
}
 
function toggleDone(id){
  completed=completed.includes(id)?completed.filter(x=>x!==id):[...completed,id];
  localStorage.setItem('peaks_done',JSON.stringify(completed));
  renderList(); showDetail(id);
}
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  currentPage=name;
  if(name==='list'){document.getElementById('list-page').classList.add('active');document.getElementById('nav-list').classList.add('active')}
  else if(name==='map'){document.getElementById('map-page').classList.add('active');document.getElementById('nav-map').classList.add('active');setTimeout(initMainMap,50)}
  else if(name==='detail'){document.getElementById('detail-page').classList.add('active')}
}
function backToList(){showPage('list')}
function copyCoords(lat,lng){
  const s=`${lat},${lng}`;
  navigator.clipboard?navigator.clipboard.writeText(s):(()=>{const t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t)})();
  const toast=document.getElementById('toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800);
}
renderList();
</script>
