<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>7 Peaks · Trail Guide</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#141210;--surface:#1e1b18;--border:rgba(196,180,154,0.1);
  --dust:#8b7f72;--sand:#c4b49a;--snow:#f0ece6;
  --summit:#e8522a;--sky:#4a8fa8;--pine:#3d6b4f;--nav-h:60px;
}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--snow)}
.topbar{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:rgba(20,18,16,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:1000}
.topbar-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--snow);flex:1}
.topbar-subtitle{font-family:'DM Mono',monospace;font-size:10px;color:var(--dust);letter-spacing:.1em}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(20,18,16,0.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;z-index:1000}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;border:none;background:none;color:var(--dust);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;transition:color .2s;-webkit-tap-highlight-color:transparent}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}
.nav-btn.active{color:var(--summit)}
.page{position:fixed;top:var(--nav-h);left:0;right:0;bottom:64px;overflow-y:auto;overflow-x:hidden;display:none;-webkit-overflow-scrolling:touch}
.page.active{display:block}
#map-page{display:none}
#map-page.active{display:block;overflow:hidden}
/* LIST */
.summary-banner{background:linear-gradient(135deg,rgba(232,82,42,.08),rgba(74,143,168,.05));border-bottom:1px solid var(--border);padding:20px 16px;display:flex;justify-content:space-around}
.s-stat{text-align:center}
.s-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--sand)}
.s-lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--dust);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.day-item{display:flex;align-items:stretch;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;-webkit-tap-highlight-color:transparent}
.day-item:active{background:rgba(255,255,255,.03)}
.day-num-col{width:60px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:36px;color:rgba(139,127,114,.25);flex-shrink:0;padding:20px 0}
.day-info{flex:1;padding:18px 16px 18px 8px}
.day-label-sm{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.18em;color:var(--dust);text-transform:uppercase;margin-bottom:4px}
.day-name{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:var(--sand);margin-bottom:8px}
.tag-row{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.08em;padding:3px 8px;border-radius:2px;text-transform:uppercase}
.tag-mi{background:rgba(74,143,168,.15);color:var(--sky);border:1px solid rgba(74,143,168,.3)}
.tag-elev{background:rgba(196,180,154,.1);color:var(--sand);border:1px solid rgba(196,180,154,.2)}
.tag-time{background:rgba(61,107,79,.2);color:#6ab087;border:1px solid rgba(61,107,79,.4)}
.tag-hard{background:rgba(232,82,42,.12);color:var(--summit);border:1px solid rgba(232,82,42,.3)}
.day-chevron{display:flex;align-items:center;padding-right:16px;color:rgba(139,127,114,.4);font-size:18px}
/* DETAIL */
#detail-page{background:var(--bg)}
.detail-header{background:linear-gradient(to bottom,rgba(232,82,42,.07),transparent);padding:24px 20px 20px;border-bottom:1px solid var(--border)}
.detail-back{display:flex;align-items:center;gap:6px;margin-bottom:16px;font-family:'DM Mono',monospace;font-size:11px;color:var(--dust);cursor:pointer;-webkit-tap-highlight-color:transparent;width:fit-content}
.detail-day-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;color:var(--summit);text-transform:uppercase;margin-bottom:6px}
.detail-peak-name{font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:1;color:var(--snow);margin-bottom:14px}
.detail-tags{display:flex;flex-wrap:wrap;gap:8px}
.detail-section{padding:20px;border-bottom:1px solid var(--border)}
.detail-section-title{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--summit);text-transform:uppercase;margin-bottom:14px}
.mini-map{height:260px;border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.waypoint-list{display:flex;flex-direction:column}
.waypoint{display:flex;align-items:flex-start;gap:14px;padding:12px 0;border-bottom:1px solid rgba(196,180,154,.06)}
.waypoint:last-child{border-bottom:none}
.wp-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;margin-top:2px}
.wp-dot.start{background:rgba(61,107,79,.3);border:1px solid #3d6b4f}
.wp-dot.mid{background:rgba(74,143,168,.2);border:1px solid var(--sky)}
.wp-dot.summit{background:rgba(232,82,42,.2);border:1px solid var(--summit)}
.wp-dot.end{background:rgba(139,127,114,.2);border:1px solid var(--dust)}
.wp-info{flex:1}
.wp-name{font-size:14px;font-weight:500;color:var(--snow);margin-bottom:2px}
.wp-elev{font-family:'DM Mono',monospace;font-size:10px;color:var(--sky)}
.wp-coords{font-family:'DM Mono',monospace;font-size:10px;color:var(--dust);margin:3px 0;cursor:pointer}
.wp-note{font-size:12px;color:var(--dust);margin-top:4px;line-height:1.5}
.open-maps-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;margin-top:8px;background:rgba(232,82,42,.12);border:1px solid rgba(232,82,42,.35);border-radius:4px;color:var(--summit);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent}
.alert-card{background:rgba(232,82,42,.08);border:1px solid rgba(232,82,42,.2);border-radius:4px;padding:12px 14px;margin-bottom:10px}
.alert-title{font-family:'DM Mono',monospace;font-size:10px;color:var(--summit);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.alert-body{font-size:13px;color:var(--dust);line-height:1.6}
.info-card{background:rgba(74,143,168,.08);border:1px solid rgba(74,143,168,.2);border-radius:4px;padding:12px 14px;margin-bottom:10px}
.info-title{font-family:'DM Mono',monospace;font-size:10px;color:var(--sky);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.info-body{font-size:13px;color:var(--dust);line-height:1.6}
.status-toggle{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent}
.status-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--dust);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;transition:all .2s}
.status-check.done{background:var(--pine);border-color:var(--pine)}
.status-text{font-size:14px;color:var(--snow)}
.status-text small{display:block;font-family:'DM Mono',monospace;font-size:10px;color:var(--dust);margin-top:2px}
/* MAP */
#main-map{width:100%;height:100%}
.leaflet-container{background:#0f0d0b !important}
.leaflet-popup-content-wrapper{background:var(--surface) !important;border:1px solid var(--border) !important;border-radius:4px !important;color:var(--snow) !important;box-shadow:0 4px 24px rgba(0,0,0,.5) !important}
.leaflet-popup-tip{background:var(--surface) !important}
.leaflet-popup-content{margin:12px 14px !important}
.popup-day{font-family:'DM Mono',monospace;font-size:9px;color:var(--summit);letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
.popup-name{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--snow)}
.popup-info{font-family:'DM Mono',monospace;font-size:10px;color:var(--dust);margin-top:4px}
.popup-btn{display:block;margin-top:10px;padding:8px;text-align:center;background:rgba(232,82,42,.15);border:1px solid rgba(232,82,42,.3);border-radius:3px;color:var(--summit);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.copied-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--pine);color:#fff;padding:8px 18px;border-radius:20px;font-family:'DM Mono',monospace;font-size:11px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:9999}
.copied-toast.show{opacity:1}
.leaflet-control-attribution{background:rgba(20,18,16,.7) !important;color:var(--dust) !important;font-size:9px !important}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:rgba(139,127,114,.3);border-radius:2px}
</style>
</head>
<body>
<div class="topbar">
  <div>
    <div class="topbar-title">7 Peaks · 6 Days</div>
    <div class="topbar-subtitle">Utah County Wasatch</div>
  </div>
  <div id="progress-mini" style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--summit)">0/7</div>
</div>
 
<div class="page active" id="list-page">
  <div class="summary-banner">
    <div class="s-stat"><div class="s-num">77.3</div><div class="s-lbl">Miles</div></div>
    <div class="s-stat"><div class="s-num">~26k</div><div class="s-lbl">Ft Gain</div></div>
    <div class="s-stat"><div class="s-num">6</div><div class="s-lbl">Days</div></div>
    <div class="s-stat"><div class="s-num">11,933</div><div class="s-lbl">Max Elev</div></div>
  </div>
  <div id="day-list"></div>
</div>
 
<div class="page" id="map-page"><div id="main-map"></div></div>
<div class="page" id="detail-page"></div>
 
<div class="bottom-nav">
  <button class="nav-btn active" id="nav-list" onclick="showPage('list')">
    <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    Days
  </button>
  <button class="nav-btn" id="nav-map" onclick="showPage('map')">
    <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
    Map
  </button>
</div>
<div class="copied-toast" id="toast">Copied!</div>
 
<script>
const PEAKS = [
  {
    id:0, day:'Monday', dayNum:1,
    name:'Loafer Mountain', subtitle:'& Santaquin Peak',
    miles:11.6, elevGain:4400, summitElev:10700, start:'6:00 AM',
    difficulty:'Hard', scramble:false,
    // Trailhead: Nebo Loop Rd just before Payson Lakes turnoff
    trailhead:{lat:39.9408,lng:-111.6441,elev:7716,label:'Loafer Mtn Trailhead — Nebo Loop Rd'},
    summit:{lat:39.9833,lng:-111.6237,elev:10685},
    // Approximate route polyline
    route:[
      [39.9408,-111.6441], // TH
      [39.9480,-111.6420], // lower forest
      [39.9550,-111.6380], // Bennie Creek junction
      [39.9610,-111.6360], // steep shale section
      [39.9679,-111.6447], // ridge saddle 9500ft
      [39.9720,-111.6360], // upper ridge
      [39.9750,-111.6330], // Loafer summit
      [39.9790,-111.6280], // saddle between peaks
      [39.9833,-111.6237], // Santaquin summit
    ],
    waypoints:[
      {type:'start',label:'Loafer Mtn Trailhead',lat:39.9408,lng:-111.6441,elev:'7,716 ft',note:'Gravel parking on LEFT off Nebo Loop Rd, just before Payson Lakes turnoff. Signed trailhead.'},
      {type:'mid',label:'Bennie Creek Junction',lat:39.9550,lng:-111.6380,elev:'~8,400 ft',note:'Turn left onto Bennie Creek trail. Steep forested switchbacks begin here.'},
      {type:'mid',label:'Ridge Saddle',lat:39.9679,lng:-111.6447,elev:'9,500 ft',note:'First big payoff — views of Payson Lakes and Mt Nebo. Santaquin goes LEFT, Loafer goes RIGHT off-trail.'},
      {type:'summit',label:'Loafer Mountain',lat:39.9750,lng:-111.6330,elev:'10,700 ft',note:'Leave-trail scramble up ridge from saddle. Slightly higher than Santaquin but less scenic.'},
      {type:'summit',label:'Santaquin Peak',lat:39.9833,lng:-111.6237,elev:'10,612 ft',note:'Better views. Trail goes around the west side of Loafer to reach this summit. Return to TH same way.'},
    ],
    alerts:[
      {type:'info',title:'Route Order',body:'From the ridge saddle: hit Loafer first (right, off-trail scramble), return to saddle, then continue on trail left/west to Santaquin Peak. Both doable from the saddle.'},
      {type:'warn',title:'Water — Bring 3+ Liters',body:'Exposed hot shale section for 1–1.5 miles fully in the sun. No water on trail. Start early.'},
    ],
    alltrails:'https://www.alltrails.com/trail/us/utah/loafer-mountain-and-santaquin-peak-trail',
  },
  {
    id:1, day:'Tuesday', dayNum:2,
    name:'Lone Peak', subtitle:"via Peak View & Jacob's Ladder",
    miles:16, elevGain:5800, summitElev:11253, start:'6:00 AM',
    difficulty:'Extreme', scramble:true,
    // Correct TH: Peak View Trailhead, Draper (Corner Canyon)
    trailhead:{lat:40.4944,lng:-111.7997,elev:5760,label:"Peak View Trailhead — Corner Canyon, Draper"},
    summit:{lat:40.5269,lng:-111.7561,elev:11253},
    route:[
      [40.4944,-111.7997], // Peak View TH
      [40.4970,-111.7900], // Corner Canyon trail start
      [40.5000,-111.7820], // Jacob's Ladder base
      [40.5050,-111.7750], // steep switchbacks mid
      [40.5100,-111.7700], // top of Jacob's Ladder
      [40.5150,-111.7680], // upper meadow
      [40.5200,-111.7640], // pine forest / granite slabs
      [40.5230,-111.7610], // cirque approach
      [40.5250,-111.7580], // cirque — VEER LEFT
      [40.5260,-111.7570], // final scramble
      [40.5269,-111.7561], // SUMMIT
    ],
    waypoints:[
      {type:'start',label:'Peak View Trailhead',lat:40.4944,lng:-111.7997,elev:'5,760 ft',note:"Navigate to 'Peak View Trailhead' in Google Maps, Draper. Large lot with restrooms. Hike behind the gate and follow signs for Jacob's Ladder."},
      {type:'mid',label:"Base of Jacob's Ladder",lat:40.5000,lng:-111.7820,elev:'~7,000 ft',note:"After ~2 miles on Corner Canyon trail/dirt road. The steep relentless switchbacks begin here. Unrelenting — this is the grind."},
      {type:'mid',label:'Top of Switchbacks / Upper Meadow',lat:40.5150,lng:-111.7680,elev:'~9,800 ft',note:'Trail finally levels out. Beautiful wildflower meadow. Trail becomes FAINT here — follow cairns and head east toward summit.'},
      {type:'mid',label:'Lone Peak Cirque',lat:40.5250,lng:-111.7580,elev:'~10,600 ft',note:'VEER LEFT at the cirque. Do not go right or straight. Follow cairns up the LEFT (south) side of the cirque toward the summit block.'},
      {type:'summit',label:'Lone Peak Summit',lat:40.5269,lng:-111.7561,elev:'11,253 ft',note:'Kitchen-table sized summit with 600 ft drops on all sides. Class 2-3 scramble at top. Off summit by noon — lightning magnet. No dogs (watershed).'},
    ],
    alerts:[
      {type:'warn',title:'⚡ Lightning + Route Finding',body:"Summit is a lightning magnet — off by noon. Trail disappears at upper meadow and cirque. VEER LEFT at cirque base. Download Gaia GPS track before you go — critical above 10,000 ft."},
      {type:'info',title:'Shuttle Note',body:"This is out-and-back from Peak View TH. The AllTrails route starts and ends at same trailhead — no shuttle needed for this one."},
    ],
    alltrails:'https://www.alltrails.com/trail/us/utah/lone-peak-via-peak-view-and-jacob-s-ladder-trail',
  },
  {
    id:2, day:'Wednesday', dayNum:3,
    name:'Spanish Fork Peak', subtitle:'via Maple Canyon',
    miles:11, elevGain:4675, summitElev:10192, start:'6:00 AM',
    difficulty:'Hard', scramble:false,
    trailhead:{lat:40.1368,lng:-111.5202,elev:5800,label:'Maple Canyon TH — end of Maple Canyon Rd, Mapleton'},
    summit:{lat:40.0882,lng:-111.5277,elev:10192},
    route:[
      [40.1368,-111.5202], // TH
      [40.1353,-111.5232], // stream crossing / trail fork
      [40.1300,-111.5280], // lower canyon climb
      [40.1250,-111.5320], // mid trail
      [40.1200,-111.5350], // Maple Canyon Lake
      [40.1150,-111.5380], // steep approach to ridge
      [40.1100,-111.5350], // ridge saddle
      [40.1000,-111.5310], // ridge traverse south
      [40.0950,-111.5290], // final approach
      [40.0882,-111.5277], // SUMMIT
    ],
    waypoints:[
      {type:'start',label:'Maple Canyon Trailhead',lat:40.1368,lng:-111.5202,elev:'5,800 ft',note:'Drive east on 400 N from Mapleton through Whitings Campground. Pass campground, park at end of paved road. Bathroom at lot. Trail starts as abandoned gravel road.'},
      {type:'mid',label:'Stream Crossing / Trail Fork',lat:40.1353,lng:-111.5232,elev:'~6,200 ft',note:'Quarter mile up Left Fork Maple Canyon Trail. Cross small wooden bridge — this is the Spanish Fork Peak trail split. Cross bridge and follow south.'},
      {type:'mid',label:'Maple Canyon Lake',lat:40.1200,lng:-111.5350,elev:'~8,800 ft',note:'Plateau with meadows and small pond. Mosquitoes in summer. Trail gets steep again after here. Snow can linger in bowl above.'},
      {type:'mid',label:'Summit Ridge Saddle',lat:40.1100,lng:-111.5350,elev:'~9,800 ft',note:'Turn LEFT (south) on ridge for summit. Views of Utah Valley to west. Turn right here instead for an alternate smaller peak if summit is snowed out.'},
      {type:'summit',label:'Spanish Fork Peak',lat:40.0882,lng:-111.5277,elev:'10,192 ft',note:'Class 1 walk-up to top. Also called Maple Mountain. Isolated peak with panoramic views. Return same way.'},
    ],
    alerts:[
      {type:'info',title:'Your Recovery Day',body:"Wednesday is your breather between Lone Peak (Tue) and the brutal Cascade/Provo traverse (Thu). Steady pace. Eat everything tonight — you'll need it tomorrow."},
      {type:'warn',title:'Snow on Ridge',body:'Late season (June/July) snow can cover the bowl before the saddle and ridge sections. Trekking poles strongly recommended.'},
    ],
    alltrails:'https://www.alltrails.com/trail/us/utah/spanish-fork-peak-via-maple-canyon',
  },
  {
    id:3, day:'Thursday', dayNum:4,
    name:'Cascade & Provo Peak', subtitle:'via Upper Pole Couloir — SHUTTLE required',
    miles:15.3, elevGain:7096, summitElev:11068, start:'5:30 AM',
    difficulty:'Extreme', scramble:true,
    // CORRECTED: Quarry TH at 40.29271,-111.60361
    trailhead:{lat:40.2927,lng:-111.6036,elev:6800,label:'Quarry Trailhead — Squaw Peak Rd (start)'},
    summit:{lat:40.2444,lng:-111.5566,elev:11068},
    route:[
      [40.2927,-111.6036], // Quarry TH
      [40.2960,-111.5980], // couloir base
      [40.3000,-111.5900], // mid couloir steep scree
      [40.3050,-111.5850], // exit couloir left to ridge
      [40.3070,-111.5880], // Cascade Mountain 10908ft
      [40.2980,-111.5820], // South Cascade 10760ft
      [40.2900,-111.5760], // Shingle Mill Peak 10680ft
      [40.2820,-111.5710], // Freedom Peak 10801ft
      [40.2650,-111.5640], // East Provo Peak 11044ft
      [40.2550,-111.5600], // knife-edge crux
      [40.2444,-111.5566], // Provo Peak SUMMIT 11068ft
      [40.2424,-111.5777], // descent to Provo Peak TH
    ],
    waypoints:[
      {type:'start',label:'Quarry Trailhead (START)',lat:40.2927,lng:-111.6036,elev:'6,800 ft',note:'Off Squaw Peak Rd. From Provo Canyon (US-189), turn right onto Squaw Peak Rd just past mile marker 9. Drive ~8 miles. Social trail leads from NORTH side of parking lot up into the couloir gully.'},
      {type:'mid',label:'Upper Pole Couloir',lat:40.2960,lng:-111.5980,elev:'~8,500 ft',note:'Steep scree-filled gully — loose and demanding. Look for cairn near top leading LEFT off the couloir onto the ridge. Do not go all the way to top of couloir.'},
      {type:'mid',label:'Cascade Mountain Summit',lat:40.3070,lng:-111.5880,elev:'10,908 ft',note:'First summit of the day. Head NORTH first from ridge to tag Cascade, then turn around and head south for the full ridge traverse.'},
      {type:'mid',label:'Freedom Peak',lat:40.2820,lng:-111.5710,elev:'10,801 ft',note:'Start of Class 3 scrambling. Gets progressively harder from here. Social trail along ridge the whole way.'},
      {type:'mid',label:'East Provo Peak / Knife Edge',lat:40.2650,lng:-111.5640,elev:'11,044 ft',note:'Most technical section. Short knife-edge Class 3 — you can bypass by dropping a few feet left onto scree. Loose rock on descent to Provo.'},
      {type:'summit',label:'Provo Peak Summit',lat:40.2444,lng:-111.5566,elev:'11,068 ft',note:'Highest point of the day. American flag usually at top. Descend standard Provo Peak trail south/west to shuttle car.'},
      {type:'end',label:'Provo Peak Trailhead (END — SHUTTLE CAR)',lat:40.2424,lng:-111.5777,elev:'8,350 ft',note:'13.5 miles up Squaw Peak Rd from Provo Canyon. Park shuttle car here the night before. Without it you walk 6+ extra miles on dirt road.'},
    ],
    alerts:[

    trailhead:{lat:40.4311,lng:-111.6391,elev:7380,label:'Timpooneke Trailhead — American Fork Canyon'},

      {type:'mid',label:'Scout Falls',lat:40.4200,lng:-111.6420,elev:'~8,200 ft',note:'Good early rest stop ~2 miles in. Waterfall on left. Trail follows South Fork river through this section.'},

    // Nebo Bench Trailhead — 24 miles up Nebo Loop from Payson
    trailhead:{lat:39.8820,lng:-111.7680,elev:9260,label:'Nebo Bench Trailhead — Nebo Loop Rd'},

    route:[

let currentPage='list', currentPeak=null, mainMap=null, detailMaps={};
let completed=JSON.parse(localStorage.getItem('peaks_done')||'[]');
 
function renderList(){
  const list=document.getElementById('day-list');
  list.innerHTML='';
  PEAKS.forEach(p=>{
    const done=completed.includes(p.id);
    const div=document.createElement('div');
    div.className='day-item';
    div.onclick=()=>showDetail(p.id);
    div.innerHTML=`
      <div class="day-num-col" style="${done?'color:rgba(61,107,79,.6)':''}">${String(p.dayNum).padStart(2,'0')}</div>
      <div class="day-info">
        <div class="day-label-sm">${p.day}${done?' · ✓ Done':''}</div>
        <div class="day-name" style="${done?'color:var(--pine)':''}">${p.name}</div>
        <div class="tag-row">
          <span class="tag tag-mi">${p.miles} mi</span>
          <span class="tag tag-elev">${p.summitElev.toLocaleString()} ft</span>
          <span class="tag tag-time">${p.start}</span>
          ${p.scramble?'<span class="tag tag-hard">⚡ Scramble</span>':''}
        </div>
      </div>
      <div class="day-chevron">›</div>`;
    list.appendChild(div);
  });
  document.getElementById('progress-mini').textContent=completed.length+'/7';
}
 
function showDetail(id){
  currentPeak=PEAKS[id];
  const p=currentPeak;
  const done=completed.includes(p.id);
  const page=document.getElementById('detail-page');
  const alertsHtml=p.alerts.map(a=>`
    <div class="${a.type==='warn'?'alert-card':'info-card'}">
      <div class="${a.type==='warn'?'alert-title':'info-title'}">${a.title}</div>
      <div class="${a.type==='warn'?'alert-body':'info-body'}">${a.body}</div>
    </div>`).join('');
  const wpsHtml=p.waypoints.map(w=>`
    <div class="waypoint">
      <div class="wp-dot ${w.type}">${w.type==='start'?'🚗':w.type==='summit'?'🏔':w.type==='end'?'🅿':'📍'}</div>
      <div class="wp-info">
        <div class="wp-name">${w.label}</div>
        <div class="wp-elev">${w.elev}</div>
        <div class="wp-coords" onclick="copyCoords(${w.lat},${w.lng})">📋 ${w.lat.toFixed(4)}, ${w.lng.toFixed(4)}</div>
        <div class="wp-note">${w.note}</div>
      </div>
    </div>`).join('');
  const appleUrl=`https://maps.apple.com/?daddr=${p.trailhead.lat},${p.trailhead.lng}&dirflg=d`;
  const googleUrl=`https://www.google.com/maps/dir/?api=1&destination=${p.trailhead.lat},${p.trailhead.lng}&travelmode=driving`;
  page.innerHTML=`
    <div class="detail-header">
      <div class="detail-back" onclick="backToList()">‹ All Days</div>
      <div class="detail-day-label">Day ${p.dayNum} · ${p.day}</div>
      <div class="detail-peak-name">${p.name}</div>
      <div class="detail-tags">
        <span class="tag tag-mi">${p.miles} mi</span>
        <span class="tag tag-elev">${p.elevGain.toLocaleString()} ft gain</span>
        <span class="tag tag-time">${p.start} start</span>
        <span class="tag tag-elev">Summit: ${p.summitElev.toLocaleString()} ft</span>
        ${p.scramble?'<span class="tag tag-hard">⚡ Scramble</span>':''}
      </div>
    </div>
    <div class="status-toggle" onclick="toggleDone(${p.id})">
      <div class="status-check ${done?'done':''}">${done?'✓':''}</div>
      <div class="status-text">${done?'Summited! ✓':'Mark as completed'}<small>${done?'Tap to unmark':'Tap after you summit'}</small></div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Trail Map — Trailhead → Summit</div>
      <div class="mini-map" id="detail-map-${p.id}"></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <a href="${appleUrl}" class="open-maps-btn" style="flex:1">🗺 Apple Maps</a>
        <a href="${googleUrl}" class="open-maps-btn" style="flex:1">📍 Google Maps</a>
      </div>
    </div>
    <div class="detail-section"><div class="detail-section-title">Important Notes</div>${alertsHtml}</div>
    <div class="detail-section">
      <div class="detail-section-title">Waypoints · Tap to copy coords</div>
      <div class="waypoint-list">${wpsHtml}</div>
    </div>
    <div class="detail-section" style="border-bottom:none">
      <a href="${p.alltrails}" class="open-maps-btn" target="_blank">↗ View on AllTrails</a>
    </div>`;
  showPage('detail');
  setTimeout(()=>initDetailMap(p), 120);
}
 
function initDetailMap(p){
  const el=document.getElementById(`detail-map-${p.id}`);
  if(!el||detailMaps[p.id]) return;
  // Fit bounds to route
  const lats=p.route.map(r=>r[0]), lngs=p.route.map(r=>r[1]);
  const minLat=Math.min(...lats), maxLat=Math.max(...lats);
  const minLng=Math.min(...lngs), maxLng=Math.max(...lngs);
  const centerLat=(minLat+maxLat)/2, centerLng=(minLng+maxLng)/2;
  const m=L.map(el,{zoomControl:true,attributionControl:false}).fitBounds([[minLat,minLng],[maxLat,maxLng]],{padding:[20,20]});
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,opacity:.9}).addTo(m);
 
  // BOLD trail line
  L.polyline(p.route,{color:'#e8522a',weight:4,opacity:.9}).addTo(m);
  // Outer glow
  L.polyline(p.route,{color:'rgba(232,82,42,.25)',weight:10,opacity:.6}).addTo(m);
 
  // Trailhead marker
  const thIcon=L.divIcon({html:'<div style="background:#3d6b4f;width:14px;height:14px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.6)"></div>',className:'',iconSize:[14,14],iconAnchor:[7,7]});
  L.marker([p.trailhead.lat,p.trailhead.lng],{icon:thIcon}).addTo(m).bindPopup(`<b>Trailhead</b><br><small>${p.trailhead.label}</small>`);
 
  // Summit marker
  const sumIcon=L.divIcon({html:'<div style="background:#e8522a;width:18px;height:18px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 10px rgba(232,82,42,.7)"></div>',className:'',iconSize:[18,18],iconAnchor:[9,9]});
  L.marker([p.summit.lat,p.summit.lng],{icon:sumIcon}).addTo(m).bindPopup(`<b>${p.name} Summit</b><br><small>${p.summitElev.toLocaleString()} ft</small>`);
 
  // Shuttle end marker for Cascade/Provo
  if(p.id===3){
    const endIcon=L.divIcon({html:'<div style="background:#4a8fa8;width:14px;height:14px;border-radius:3px;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.6)"></div>',className:'',iconSize:[14,14],iconAnchor:[7,7]});
    L.marker([40.2424,-111.5777],{icon:endIcon}).addTo(m).bindPopup('<b>Shuttle Car End TH</b><br><small>40.2424, -111.5777</small>');
  }
 
  detailMaps[p.id]=m;
}
 
function initMainMap(){
  if(mainMap) return;
  mainMap=L.map('main-map',{zoomControl:true,attributionControl:true}).setView([40.10,-111.65],10);
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap'}).addTo(mainMap);
  PEAKS.forEach(p=>{
    const done=completed.includes(p.id);
    // Draw route line on overview
    L.polyline(p.route,{color:done?'#3d6b4f':'#e8522a',weight:2.5,opacity:.7}).addTo(mainMap);
    // Summit marker
    const icon=L.divIcon({
      html:`<div style="background:${done?'#3d6b4f':'#e8522a'};width:34px;height:34px;border-radius:50%;border:2.5px solid #f0ece6;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:14px;color:#fff;box-shadow:0 2px 14px rgba(${done?'61,107,79':'232,82,42'},.6)">${p.dayNum}</div>`,
      className:'',iconSize:[34,34],iconAnchor:[17,17]
    });
    L.marker([p.summit.lat,p.summit.lng],{icon}).addTo(mainMap).bindPopup(`
      <div class="popup-day">Day ${p.dayNum} · ${p.day}</div>
      <div class="popup-name">${p.name}</div>
      <div class="popup-info">${p.miles} mi · ${p.summitElev.toLocaleString()} ft · ${p.start}</div>
      <a class="popup-btn" onclick="showDetail(${p.id});return false">View Route →</a>`);
    // TH dot
    L.circleMarker([p.trailhead.lat,p.trailhead.lng],{radius:5,color:'#4a8fa8',fillColor:'#4a8fa8',fillOpacity:.8,weight:1.5}).addTo(mainMap)
      .bindPopup(`<div class="popup-day">TH · ${p.name}</div><div class="popup-info">${p.trailhead.label}</div>`);
  });
}
 
function toggleDone(id){
  completed=completed.includes(id)?completed.filter(x=>x!==id):[...completed,id];
  localStorage.setItem('peaks_done',JSON.stringify(completed));
  renderList();
  showDetail(id);
}
 
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  currentPage=name;
  if(name==='list'){document.getElementById('list-page').classList.add('active');document.getElementById('nav-list').classList.add('active')}
  else if(name==='map'){document.getElementById('map-page').classList.add('active');document.getElementById('nav-map').classList.add('active');setTimeout(initMainMap,50)}
  else if(name==='detail'){document.getElementById('detail-page').classList.add('active')}
}
function backToList(){showPage('list')}
function copyCoords(lat,lng){
  const s=`${lat},${lng}`;
  navigator.clipboard?navigator.clipboard.writeText(s):(()=>{const t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t)})();
  const toast=document.getElementById('toast');
  toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800);
}
 
renderList();
</script>
