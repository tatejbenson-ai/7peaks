<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>7 Peaks · Trail Guide</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#141210;--surface:#1e1b18;--border:rgba(196,180,154,0.1);--dust:#8b7f72;--sand:#c4b49a;--snow:#f0ece6;--summit:#e8522a;--sky:#4a8fa8;--pine:#3d6b4f;--nav-h:60px}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--snow)}
.topbar{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:rgba(20,18,16,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:1000}
.topbar-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--snow);flex:1}
.topbar-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--dust);letter-spacing:.1em}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(20,18,16,0.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;z-index:1000}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;border:none;background:none;color:var(--dust);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;transition:color .2s;-webkit-tap-highlight-color:transparent}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}
.nav-btn.active{color:var(--summit)}
.page{position:fixed;top:var(--nav-h);left:0;right:0;bottom:64px;overflow-y:auto;overflow-x:hidden;display:none;-webkit-overflow-scrolling:touch}
.page.active{display:block}
#map-page{display:none}
#map-page.active{display:block;overflow:hidden}
.summary-banner{background:linear-gradient(135deg,rgba(232,82,42,.08),rgba(74,143,168,.05));border-bottom:1px solid var(--border);padding:20px 16px;display:flex;justify-content:space-around}
.s-stat{text-align:center}
.s-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--sand)}
.s-lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--dust);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.day-item{display:flex;align-items:stretch;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;-webkit-tap-highlight-color:transparent}
.day-item:active{background:rgba(255,255,255,.03)}
.day-num-col{width:60px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:36px;color:rgba(139,127,114,.25);flex-shrink:0;padding:20px 0}
.day-info{flex:1;padding:18px 16px 18px 8px}
.day-label-sm{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.18em;color:var(--dust);text-transform:uppercase;margin-bottom:4px}
.day-name{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:var(--sand);margin-bottom:8px}
.tag-row{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.08em;padding:3px 8px;border-radius:2px;text-transform:uppercase}
.tag-mi{background:rgba(74,143,168,.15);color:var(--sky);border:1px solid rgba(74,143,168,.3)}
.tag-elev{background:rgba(196,180,154,.1);color:var(--sand);border:1px solid rgba(196,180,154,.2)}
.tag-time{background:rgba(61,107,79,.2);color:#6ab087;border:1px solid rgba(61,107,79,.4)}
.tag-hard{background:rgba(232,82,42,.12);color:var(--summit);border:1px solid rgba(232,82,42,.3)}
.day-chevron{display:flex;align-items:center;padding-right:16px;color:rgba(139,127,114,.4);font-size:18px}
#detail-page{background:var(--bg)}
.detail-header{background:linear-gradient(to bottom,rgba(232,82,42,.07),transparent);padding:24px 20px 20px;border-bottom:1px solid var(--border)}
.detail-back{display:flex;align-items:center;gap:6px;margin-bottom:16px;font-family:'DM Mono',monospace;font-size:11px;color:var(--dust);cursor:pointer;-webkit-tap-highlight-color:transparent;width:fit-content}
.detail-day-lbl{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.2em;color:var(--summit);text-transform:uppercase;margin-bottom:6px}
.detail-peak-name{font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:1;color:var(--snow);margin-bottom:14px}
.detail-tags{display:flex;flex-wrap:wrap;gap:8px}
.detail-section{padding:20px;border-bottom:1px solid var(--border)}
.detail-section-title{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--summit);text-transform:uppercase;margin-bottom:14px}
.mini-map{height:260px;border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.waypoint-list{display:flex;flex-direction:column}
.waypoint{display:flex;align-items:flex-start;gap:14px;padding:12px 0;border-bottom:1px solid rgba(196,180,154,.06)}
.waypoint:last-child{border-bottom:none}
.wp-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;margin-top:2px}
.wp-dot.start{background:rgba(61,107,79,.3);border:1px solid #3d6b4f}
.wp-dot.mid{background:rgba(74,143,168,.2);border:1px solid var(--sky)}
.wp-dot.summit{background:rgba(232,82,42,.2);border:1px solid var(--summit)}
.wp-dot.end{background:rgba(139,127,114,.2);border:1px solid var(--dust)}
.wp-info{flex:1}
.wp-name{font-size:14px;font-weight:500;color:var(--snow);margin-bottom:2px}
.wp-elev{font-family:'DM Mono',monospace;font-size:10px;color:var(--sky)}
.wp-coords{font-family:'DM Mono',monospace;font-size:10px;color:var(--dust);margin:3px 0;cursor:pointer}
.wp-note{font-size:12px;color:var(--dust);margin-top:4px;line-height:1.5}
.open-maps-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;margin-top:8px;background:rgba(232,82,42,.12);border:1px solid rgba(232,82,42,.35);border-radius:4px;color:var(--summit);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent}
.alert-card{background:rgba(232,82,42,.08);border:1px solid rgba(232,82,42,.2);border-radius:4px;padding:12px 14px;margin-bottom:10px}
.alert-title{font-family:'DM Mono',monospace;font-size:10px;color:var(--summit);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.alert-body{font-size:13px;color:var(--dust);line-height:1.6}
.info-card{background:rgba(74,143,168,.08);border:1px solid rgba(74,143,168,.2);border-radius:4px;padding:12px 14px;margin-bottom:10px}
.info-title{font-family:'DM Mono',monospace;font-size:10px;color:var(--sky);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.info-body{font-size:13px;color:var(--dust);line-height:1.6}
.status-toggle{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent}
.status-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--dust);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;transition:all .2s}
.status-check.done{background:var(--pine);border-color:var(--pine)}
.status-text{font-size:14px;color:var(--snow)}
.status-text small{display:block;font-family:'DM Mono',monospace;font-size:10px;color:var(--dust);margin-top:2px}
#main-map{width:100%;height:100%}
.leaflet-container{background:#0f0d0b !important}
.leaflet-popup-content-wrapper{background:var(--surface) !important;border:1px solid var(--border) !important;border-radius:4px !important;color:var(--snow) !important;box-shadow:0 4px 24px rgba(0,0,0,.5) !important}
.leaflet-popup-tip{background:var(--surface) !important}
.leaflet-popup-content{margin:12px 14px !important}
.popup-day{font-family:'DM Mono',monospace;font-size:9px;color:var(--summit);letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
.popup-name{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--snow)}
.popup-info{font-family:'DM Mono',monospace;font-size:10px;color:var(--dust);margin-top:4px}
.popup-btn{display:block;margin-top:10px;padding:8px;text-align:center;background:rgba(232,82,42,.15);border:1px solid rgba(232,82,42,.3);border-radius:3px;color:var(--summit);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.copied-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--pine);color:#fff;padding:8px 18px;border-radius:20px;font-family:'DM Mono',monospace;font-size:11px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:9999}
.copied-toast.show{opacity:1}
.leaflet-control-attribution{background:rgba(20,18,16,.7) !important;color:var(--dust) !important;font-size:9px !important}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:rgba(139,127,114,.3);border-radius:2px}
</style>
</head>
<body>
<div class="topbar">
  <div><div class="topbar-title">7 Peaks · 6 Days</div><div class="topbar-sub">Utah County Wasatch</div></div>
  <div id="progress-mini" style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--summit)">0/7</div>
</div>
<div class="page active" id="list-page">
  <div class="summary-banner">
    <div class="s-stat"><div class="s-num">77.3</div><div class="s-lbl">Miles</div></div>
    <div class="s-stat"><div class="s-num">~26k</div><div class="s-lbl">Ft Gain</div></div>
    <div class="s-stat"><div class="s-num">6</div><div class="s-lbl">Days</div></div>
    <div class="s-stat"><div class="s-num">11,933</div><div class="s-lbl">Max Elev</div></div>
  </div>
  <div id="day-list"></div>
</div>
<div class="page" id="map-page"><div id="main-map"></div></div>
<div class="page" id="detail-page"></div>
<div class="bottom-nav">
  <button class="nav-btn active" id="nav-list" onclick="showPage('list')">
    <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>Days
  </button>
  <button class="nav-btn" id="nav-map" onclick="showPage('map')">
    <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>Map
  </button>
</div>
<div class="copied-toast" id="toast">Copied!</div>
 
<script>
// ============================================================
// ALL ROUTES VERIFIED FROM OFFICIAL SOURCES
// Sources: USFS, SummitPost, Stav is Lost, Anne's Travels,
//          Girl on a Hike, Road Trip Ryan, Waymarking.com
// ============================================================
const PEAKS = [
 
  // ── DAY 1: LOAFER MOUNTAIN ─────────────────────────────
  // TH: 39.9408, -111.6441 (Anne's Travels, verified USFS)
  // Route: TH → trail descends briefly → Blackhawk jct (stay straight) →
  //        Bennie Creek jct (stay straight/continue on Loafer Mtn Trail) →
  //        0.1mi later turn RIGHT on Loafer Mtn Trail → steep ascent →
  //        ridge saddle → Santaquin Peak (trail) / Loafer (off-trail right)
  {
    id:0, day:'Monday', dayNum:1,
    name:'Loafer Mountain', subtitle:'& Santaquin Peak',
    miles:11.6, elevGain:4400, summitElev:10700, start:'6:00 AM', scramble:false,
    trailhead:{lat:39.9408,lng:-111.6441,elev:7716,label:'Loafer Mtn Trailhead — Nebo Loop Rd'},
    summit:{lat:39.9833,lng:-111.6237,elev:10685},
    route:[
      [39.9408,-111.6441], // TH — gravel parking, fenced
      [39.9415,-111.6418], // Blackhawk Trail jct — STAY STRAIGHT (don't turn right)
      [39.9440,-111.6400], // trail descends to small creek crossing
      [39.9480,-111.6390], // Bennie Creek Trail jct — STAY STRAIGHT, continue on Loafer Mtn Trail
      [39.9490,-111.6382], // 0.1mi later TURN RIGHT onto Loafer Mtn Trail (bikes/horses ok here)
      [39.9530,-111.6350], // steep ascent begins, deciduous forest
      [39.9580,-111.6320], // upper forest, aspens and oaks
      [39.9630,-111.6310], // treeline, trail gets rocky
      [39.9679,-111.6300], // ridge saddle — views of Payson Lakes, Nebo to south
      [39.9710,-111.6270], // continue NW on ridge toward Santaquin
      [39.9760,-111.6255], // trail contours west side of Loafer
      [39.9833,-111.6237], // SANTAQUIN PEAK 10,612 ft
    ],
    waypoints:[
      {type:'start',label:'Loafer Mtn Trailhead',lat:39.9408,lng:-111.6441,elev:'7,716 ft',
       note:'Gravel parking on LEFT off Nebo Loop Rd, just before Payson Lakes turnoff. Signed "Loafer Mtn TR. 098". No fee, no bathroom.'},
      {type:'mid',label:'Blackhawk Trail Junction',lat:39.9415,lng:-111.6418,elev:'7,706 ft',
       note:'Just 0.14 miles in — STAY STRAIGHT on Loafer Mtn Trail. Do not turn right onto Blackhawk Trail.'},
      {type:'mid',label:'Bennie Creek Junction',lat:39.9480,lng:-111.6390,elev:'~7,800 ft',
       note:'STAY STRAIGHT — continue on Loafer Mtn Trail through the trees (don\'t cross the fence). Cross small creek just after. Then 0.1mi later TURN RIGHT onto the actual Loafer Mtn Trail.'},
      {type:'mid',label:'Ridge Saddle',lat:39.9679,lng:-111.6300,elev:'~9,500 ft',
       note:'3.4 miles in. First big views — Payson Lakes below, Nebo to south. Trail continues NW to Santaquin. For Loafer Mountain (2ft higher, off-trail), scramble RIGHT up the ridge spine from here.'},
      {type:'summit',label:'Santaquin Peak',lat:39.9833,lng:-111.6237,elev:'10,612 ft',
       note:'Trail goes around WEST side of Loafer to reach Santaquin. Better views than Loafer — 360° of Utah Lake, Timp, Nebo. Return same way to TH.'},
    ],
    alerts:[
      {type:'warn',title:'Tricky Junctions Early On',body:'Two confusing junctions in the first mile. At Blackhawk: stay straight. At Bennie Creek: stay straight through trees, cross creek, then TURN RIGHT 0.1mi later onto the Loafer Mtn Trail. Signs are present but easy to miss.'},
      {type:'warn',title:'No Water — 3+ Liters',body:'Exposed ridge for the final miles, hot in summer. No water sources on route. Start early.'},
    ],
    alltrails:'https://www.alltrails.com/trail/us/utah/loafer-mountain-and-santaquin-peak-trail',
  },
 
  // ── DAY 2: LONE PEAK ───────────────────────────────────
  // TH: Orson Smith Park, 40.5217, -111.8341 (verified SummitPost, KSL, AllTrails)
  // Route: Orson Smith stairs → E on dirt trail → Aqueduct Trail LEFT →
  //        BST → Cherry Canyon Logging Trail (signed, no dogs past here) →
  //        steep switchbacks S-facing slope → ridge corner TURN LEFT east →
  //        mountain mahogany forest → Bear Canyon / Cherry Canyon → flatten →
  //        trail fork LEFT into woods → creek crossings → Outlaw Cabin →
  //        drainage east → cirque → VEER LEFT up south side → summit
  {
    id:1, day:'Tuesday', dayNum:2,
    name:'Lone Peak', subtitle:'via Cherry Canyon Logging Trail',
    miles:16, elevGain:6751, summitElev:11253, start:'6:00 AM', scramble:true,
    trailhead:{lat:40.5217,lng:-111.8341,elev:4820,label:'Orson Smith Park — 2000 E & 12600 S, Draper'},
    summit:{lat:40.5269,lng:-111.7561,elev:11253},
    route:[
      [40.5217,-111.8341], // Orson Smith Park TH
      [40.5213,-111.8320], // up wooden stairs N of restrooms, head east
      [40.5208,-111.8290], // junction — Aqueduct Trail, turn LEFT
      [40.5203,-111.8265], // follow to BST junction
      [40.5198,-111.8240], // BST — turn LEFT, Cherry Canyon Logging Trail signed ~75yds ahead
      [40.5193,-111.8215], // Cherry Canyon Logging Trail — TURN RIGHT (NO DOGS sign)
      [40.5185,-111.8175], // 6-7 steep switchbacks on exposed S-facing slope
      [40.5175,-111.8130], // trail flattens, crosses Cherry Canyon
      [40.5168,-111.8090], // climbs again into forest
      [40.5162,-111.8050], // ridge corner — TURN LEFT (east) into mountain mahogany forest
      [40.5155,-111.7990], // shaded pine forest, aroma section
      [40.5150,-111.7950], // flatter section, camping hollow
      [40.5148,-111.7910], // trail fork — TURN LEFT into the woods (toward Bear Canyon)
      [40.5150,-111.7870], // Bear Canyon / creek crossings — WATER HERE
      [40.5155,-111.7830], // Outlaw Cabin on right (9,275 ft)
      [40.5165,-111.7780], // continue E up drainage (no trail), stay LEFT/north of drainage
      [40.5190,-111.7720], // drainage narrows, granite cliffs
      [40.5210,-111.7670], // begin veering left through rocks onto west wall of cirque
      [40.5230,-111.7630], // west wall of cirque — summit pops into view
      [40.5250,-111.7600], // VEER LEFT up south side of cirque (cairns)
      [40.5260,-111.7580], // Class 2-3 scramble, final push
      [40.5269,-111.7561], // LONE PEAK SUMMIT 11,253 ft
    ],
    waypoints:[
      {type:'start',label:'Orson Smith Park TH',lat:40.5217,lng:-111.8341,elev:'4,820 ft',
       note:'2000 E & 12600 S in Draper. Large paved lot with restrooms and water. Trail starts UP THE STAIRS just LEFT (north) of the restrooms, behind the info sign. Head east.'},
      {type:'mid',label:'Cherry Canyon Logging Trail',lat:40.5193,lng:-111.8215,elev:'~5,200 ft',
       note:'After Aqueduct Trail and BST junctions (~0.5mi), look for "Cherry Canyon Logging Trail" sign and NO DOGS sign. TURN RIGHT here. The real climb begins with 6-7 steep switchbacks.'},
      {type:'mid',label:'Ridge Corner — Turn Left East',lat:40.5162,lng:-111.8050,elev:'~7,200 ft',
       note:'Top of exposed switchbacks. TURN LEFT (east) into shaded mountain mahogany forest. Famous for incredible aroma. Trail levels out for a stretch.'},
      {type:'mid',label:'Outlaw Cabin (water nearby)',lat:40.5155,lng:-111.7830,elev:'9,275 ft',
       note:'Historic log cabin with wood stove on your RIGHT. Creek crossings just before — fill water here (filter required). Trail fork before here: go LEFT into the woods.'},
      {type:'mid',label:'Cirque — Veer Left',lat:40.5230,lng:-111.7630,elev:'~10,600 ft',
       note:'Follow drainage east from cabin, stay LEFT of drainage. Granite cliffs rim the top. When summit pops into view, VEER LEFT up the west/south wall via cairns. Do not go straight.'},
      {type:'summit',label:'Lone Peak Summit',lat:40.5269,lng:-111.7561,elev:'11,253 ft',
       note:'Kitchen-table sized with 600ft drops. Class 2-3 scramble final section. NO DOGS (watershed). Off summit by noon — serious lightning risk.'},
    ],
    alerts:[
      {type:'warn',title:'⚡ Route Finding + Lightning',body:'Trail disappears above Outlaw Cabin. Follow drainage, stay left, then cairns to cirque. VEER LEFT at cirque. Download a GPS track before you go — critical above 9,000 ft. Off summit by noon.'},
      {type:'info',title:'Water at Outlaw Cabin',body:'Creek crossings just before Outlaw Cabin (~9,275 ft) — the only reliable water on route. Bring a filter. Fill up here.'},
    ],
    alltrails:'https://www.alltrails.com/trail/us/utah/lone-peak-via-cherry-canyon-logging-trail',
  },
 
  // ── DAY 3: SPANISH FORK PEAK ───────────────────────────
  // TH: 40.13675, -111.520194 (USFS official GPS)
  // Route: TH (end of road) → abandoned gravel road → 0.25mi on Left Fork
  //        Maple Canyon Trail → bridge crossing at 40.1353, -111.5232 →
  //        Spanish Fork Peak Trail heads SOUTH → forested canyon →
  //        steep switchbacks → meadows → Maple Canyon Lake plateau →
  //        steep bowl → ridge saddle → TURN LEFT south → summit
  {
    id:2, day:'Wednesday', dayNum:3,
    name:'Spanish Fork Peak', subtitle:'via Maple Canyon',
    miles:11, elevGain:4675, summitElev:10192, start:'6:00 AM', scramble:false,
    trailhead:{lat:40.1368,lng:-111.5202,elev:5800,label:'Maple Canyon TH — end of Maple Canyon Rd, Mapleton'},
    summit:{lat:40.0882,lng:-111.5277,elev:10192},
    route:[
      [40.1368,-111.5202], // TH — end of paved road, lot with bathroom
      [40.1360,-111.5215], // trail starts as abandoned gravel road heading up
      [40.1353,-111.5232], // bridge crossing — LEFT FORK Maple Canyon Trail splits here
      [40.1340,-111.5250], // Spanish Fork Peak Trail heads SOUTH (upstream)
      [40.1310,-111.5270], // forested canyon, box elder/Douglas-fir/aspen
      [40.1270,-111.5295], // mid trail, steady climb
      [40.1230,-111.5320], // steeper section approaching plateau
      [40.1195,-111.5345], // Maple Canyon Lake plateau (pond/meadows)
      [40.1155,-111.5368], // steep bowl, trail gets rocky
      [40.1110,-111.5355], // bowl narrows, ridge saddle ahead
      [40.1080,-111.5340], // RIDGE SADDLE — TURN LEFT (south) for summit
      [40.1020,-111.5310], // ridge traverse heading south
      [40.0950,-111.5292], // final approach, steepens
      [40.0882,-111.5277], // SUMMIT 10,192 ft
    ],
    waypoints:[
      {type:'start',label:'Maple Canyon Trailhead',lat:40.1368,lng:-111.5202,elev:'5,800 ft',
       note:'Drive east on 400 N from Mapleton, through Whitings Campground (fee area for camping only, hiking is free). Drive past campground to END of paved road. Parking lot with bathroom. Trail starts as an old gravel road at top of lot.'},
      {type:'mid',label:'Bridge Crossing — Trail Split',lat:40.1353,lng:-111.5232,elev:'~6,100 ft',

// ── APP ───────────────────────────────────────────────────
let currentPage='list', currentPeak=null, mainMap=null, detailMaps={};
let completed=JSON.parse(localStorage.getItem('peaks_done')||'[]');
 
function renderList(){
  const list=document.getElementById('day-list');
  list.innerHTML='';
  PEAKS.forEach(p=>{
    const done=completed.includes(p.id);
    const div=document.createElement('div');
    div.className='day-item';
    div.onclick=()=>showDetail(p.id);
    div.innerHTML=`
      <div class="day-num-col" style="${done?'color:rgba(61,107,79,.6)':''}">${String(p.dayNum).padStart(2,'0')}</div>
      <div class="day-info">
        <div class="day-label-sm">${p.day}${done?' · ✓ Done':''}</div>
        <div class="day-name" style="${done?'color:var(--pine)':''}">${p.name}</div>
        <div class="tag-row">
          <span class="tag tag-mi">${p.miles} mi</span>
          <span class="tag tag-elev">${p.summitElev.toLocaleString()} ft</span>
          <span class="tag tag-time">${p.start}</span>
          ${p.scramble?'<span class="tag tag-hard">⚡ Scramble</span>':''}
        </div>
      </div>
      <div class="day-chevron">›</div>`;
    list.appendChild(div);
  });
  document.getElementById('progress-mini').textContent=completed.length+'/7';
}
 
function showDetail(id){
  currentPeak=PEAKS[id];
  const p=currentPeak;
  const done=completed.includes(p.id);
  const page=document.getElementById('detail-page');
  const aHtml=p.alerts.map(a=>`
    <div class="${a.type==='warn'?'alert-card':'info-card'}">
      <div class="${a.type==='warn'?'alert-title':'info-title'}">${a.title}</div>
      <div class="${a.type==='warn'?'alert-body':'info-body'}">${a.body}</div>
    </div>`).join('');
  const wHtml=p.waypoints.map(w=>`
    <div class="waypoint">
      <div class="wp-dot ${w.type}">${w.type==='start'?'🚗':w.type==='summit'?'🏔':w.type==='end'?'🅿':'📍'}</div>
      <div class="wp-info">
        <div class="wp-name">${w.label}</div>
        <div class="wp-elev">${w.elev}</div>
        <div class="wp-coords" onclick="copyCoords(${w.lat},${w.lng})">📋 ${w.lat.toFixed(4)}, ${w.lng.toFixed(4)}</div>
        <div class="wp-note">${w.note}</div>
      </div>
    </div>`).join('');
  const apple=`https://maps.apple.com/?daddr=${p.trailhead.lat},${p.trailhead.lng}&dirflg=d`;
  const google=`https://www.google.com/maps/dir/?api=1&destination=${p.trailhead.lat},${p.trailhead.lng}&travelmode=driving`;
  page.innerHTML=`
    <div class="detail-header">
      <div class="detail-back" onclick="backToList()">‹ All Days</div>
      <div class="detail-day-lbl">Day ${p.dayNum} · ${p.day}</div>
      <div class="detail-peak-name">${p.name}</div>
      <div class="detail-tags">
        <span class="tag tag-mi">${p.miles} mi</span>
        <span class="tag tag-elev">${p.elevGain.toLocaleString()} ft gain</span>
        <span class="tag tag-time">${p.start} start</span>
        <span class="tag tag-elev">Summit: ${p.summitElev.toLocaleString()} ft</span>
        ${p.scramble?'<span class="tag tag-hard">⚡ Scramble</span>':''}
      </div>
    </div>
    <div class="status-toggle" onclick="toggleDone(${p.id})">
      <div class="status-check ${done?'done':''}">${done?'✓':''}</div>
      <div class="status-text">${done?'Summited! ✓':'Mark as completed'}<small>${done?'Tap to unmark':'Tap after you summit'}</small></div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Trail Map — Follow the Orange Line</div>
      <div class="mini-map" id="detail-map-${p.id}"></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <a href="${apple}" class="open-maps-btn" style="flex:1">🗺 Apple Maps</a>
        <a href="${google}" class="open-maps-btn" style="flex:1">📍 Google Maps</a>
      </div>
    </div>
    <div class="detail-section"><div class="detail-section-title">Important Notes</div>${aHtml}</div>
    <div class="detail-section">
      <div class="detail-section-title">Waypoints · Tap coords to copy</div>
      <div class="waypoint-list">${wHtml}</div>
    </div>
    <div class="detail-section" style="border-bottom:none">
      <a href="${p.alltrails}" class="open-maps-btn" target="_blank">↗ View on AllTrails</a>
    </div>`;
  showPage('detail');
  setTimeout(()=>initDetailMap(p),120);
}
 
function initDetailMap(p){
  const el=document.getElementById(`detail-map-${p.id}`);
  if(!el||detailMaps[p.id]) return;
  const lats=p.route.map(r=>r[0]),lngs=p.route.map(r=>r[1]);
  const m=L.map(el,{zoomControl:true,attributionControl:false})
    .fitBounds([[Math.min(...lats),Math.min(...lngs)],[Math.max(...lats),Math.max(...lngs)]],{padding:[28,28]});
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,opacity:.9}).addTo(m);
  // Glow + bold trail line
  L.polyline(p.route,{color:'rgba(232,82,42,.25)',weight:14,opacity:.6,lineCap:'round',lineJoin:'round'}).addTo(m);
  L.polyline(p.route,{color:'#ff6b3d',weight:4,opacity:.95,lineCap:'round',lineJoin:'round'}).addTo(m);
  // TH marker (green dot)
  const thIcon=L.divIcon({html:'<div style="background:#3d6b4f;width:14px;height:14px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.7)"></div>',className:'',iconSize:[14,14],iconAnchor:[7,7]});
  L.marker([p.trailhead.lat,p.trailhead.lng],{icon:thIcon}).addTo(m).bindPopup(`<b>Trailhead</b><br><small>${p.trailhead.label}</small>`);
  // Summit marker (orange dot)
  const sIcon=L.divIcon({html:'<div style="background:#e8522a;width:18px;height:18px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 10px rgba(232,82,42,.8)"></div>',className:'',iconSize:[18,18],iconAnchor:[9,9]});
  L.marker([p.summit.lat,p.summit.lng],{icon:sIcon}).addTo(m).bindPopup(`<b>${p.name} Summit</b><br><small>${p.summitElev.toLocaleString()} ft</small>`);
  // Cascade/Provo shuttle end marker (blue square)
  if(p.id===3){
    const eIcon=L.divIcon({html:'<div style="background:#4a8fa8;width:14px;height:14px;border-radius:3px;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.7)"></div>',className:'',iconSize:[14,14],iconAnchor:[7,7]});
    L.marker([40.2424,-111.5777],{icon:eIcon}).addTo(m).bindPopup('<b>Shuttle Car TH</b><br><small>40.2424, -111.5777</small>');
  }
  detailMaps[p.id]=m;
}
 
function initMainMap(){
  if(mainMap) return;
  mainMap=L.map('main-map',{zoomControl:true,attributionControl:true}).setView([40.10,-111.65],10);
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap'}).addTo(mainMap);
  PEAKS.forEach(p=>{
    const done=completed.includes(p.id);
    L.polyline(p.route,{color:done?'rgba(61,107,79,.6)':'rgba(232,82,42,.5)',weight:3,opacity:.9,lineCap:'round'}).addTo(mainMap);
    const icon=L.divIcon({
      html:`<div style="background:${done?'#3d6b4f':'#e8522a'};width:34px;height:34px;border-radius:50%;border:2.5px solid #f0ece6;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:14px;color:#fff;box-shadow:0 2px 14px rgba(${done?'61,107,79':'232,82,42'},.7)">${p.dayNum}</div>`,
      className:'',iconSize:[34,34],iconAnchor:[17,17]
    });
    L.marker([p.summit.lat,p.summit.lng],{icon}).addTo(mainMap)
      .bindPopup(`<div class="popup-day">Day ${p.dayNum} · ${p.day}</div><div class="popup-name">${p.name}</div><div class="popup-info">${p.miles} mi · ${p.summitElev.toLocaleString()} ft · ${p.start}</div><a class="popup-btn" onclick="showDetail(${p.id});return false">View Route →</a>`);
    L.circleMarker([p.trailhead.lat,p.trailhead.lng],{radius:5,color:'#4a8fa8',fillColor:'#4a8fa8',fillOpacity:.9,weight:1.5}).addTo(mainMap)
      .bindPopup(`<div class="popup-day">TH · ${p.name}</div><div class="popup-info">${p.trailhead.label}</div>`);
  });
}
 
function toggleDone(id){
  completed=completed.includes(id)?completed.filter(x=>x!==id):[...completed,id];
  localStorage.setItem('peaks_done',JSON.stringify(completed));
  renderList(); showDetail(id);
}
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  currentPage=name;
  if(name==='list'){document.getElementById('list-page').classList.add('active');document.getElementById('nav-list').classList.add('active')}
  else if(name==='map'){document.getElementById('map-page').classList.add('active');document.getElementById('nav-map').classList.add('active');setTimeout(initMainMap,50)}
  else if(name==='detail'){document.getElementById('detail-page').classList.add('active')}
}
function backToList(){showPage('list')}
function copyCoords(lat,lng){
  const s=`${lat},${lng}`;
  navigator.clipboard?navigator.clipboard.writeText(s):(()=>{const t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t)})();
  const toast=document.getElementById('toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800);
}
renderList();
</script>
