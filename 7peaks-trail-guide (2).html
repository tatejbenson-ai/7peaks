<html lang="en">
<head>
<meta charset="UTF-8">

<title>7 Peaks · Trail Guide</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#141210;--surface:#1e1b18;--border:rgba(196,180,154,0.1);--dust:#8b7f72;--sand:#c4b49a;--snow:#f0ece6;--summit:#e8522a;--sky:#4a8fa8;--pine:#3d6b4f;--nav-h:60px}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--snow)}
.topbar{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:rgba(20,18,16,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:1000}
.topbar-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--snow);flex:1}
.topbar-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--dust);letter-spacing:.1em}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(20,18,16,0.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;z-index:1000}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;border:none;background:none;color:var(--dust);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;transition:color .2s;-webkit-tap-highlight-color:transparent}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}
.nav-btn.active{color:var(--summit)}
.page{position:fixed;top:var(--nav-h);left:0;right:0;bottom:64px;overflow-y:auto;overflow-x:hidden;display:none;-webkit-overflow-scrolling:touch}
.page.active{display:block}
#map-page{display:none;overflow:hidden}
#map-page.active{display:block}
.summary-banner{background:linear-gradient(135deg,rgba(232,82,42,.08),rgba(74,143,168,.05));border-bottom:1px solid var(--border);padding:20px 16px;display:flex;justify-content:space-around}
.s-stat{text-align:center}
.s-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--sand)}
.s-lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--dust);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}

.day-num-col{width:60px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:36px;color:rgba(139,127,114,.25);flex-shrink:0;padding:20px 0}
.day-info{flex:1;padding:18px 16px 18px 8px}

.day-name{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:var(--sand);margin-bottom:8px}
.tag-row{display:flex;flex-wrap:wrap;gap:6px}

/* Download banner */
.dl-banner{background:rgba(74,143,168,.08);border-bottom:1px solid rgba(74,143,168,.2);padding:16px}
.dl-banner-title{font-family:'DM Mono',monospace;font-size:11px;color:var(--sky);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}
.dl-banner-sub{font-size:12px;color:var(--dust);margin-bottom:12px;line-height:1.5}
.dl-btn{width:100%;padding:14px;background:rgba(74,143,168,.15);border:1px solid rgba(74,143,168,.4);border-radius:4px;color:var(--sky);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;gap:8px}

.dl-btn.done{background:rgba(61,107,79,.15);border-color:rgba(61,107,79,.4);color:#6ab087}
.dl-progress-wrap{margin-top:10px;display:none}

.dl-progress-bar{height:4px;background:rgba(196,180,154,.1);border-radius:2px;overflow:hidden}

/* Main map */
#map-page{position:fixed;top:var(--nav-h);left:0;right:0;bottom:64px}
#main-map{width:100%;height:100%;position:absolute;top:0;left:0;right:0;bottom:0}
.leaflet-container{background:#1a1814 !important}
.leaflet-popup-content-wrapper{background:var(--surface) !important;border:1px solid var(--border) !important;border-radius:4px !important;color:var(--snow) !important;box-shadow:0 4px 24px rgba(0,0,0,.5) !important}
.leaflet-popup-tip{background:var(--surface) !important}
.leaflet-popup-content{margin:12px 14px !important}
.popup-day{font-family:'DM Mono',monospace;font-size:9px;color:var(--summit);letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
.popup-name{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--snow)}
.popup-info{font-family:'DM Mono',monospace;font-size:10px;color:var(--dust);margin-top:4px}
.popup-btn{display:block;margin-top:10px;padding:8px;text-align:center;background:rgba(232,82,42,.15);border:1px solid rgba(232,82,42,.3);border-radius:3px;color:var(--summit);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.copied-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--pine);color:#fff;padding:8px 18px;border-radius:20px;font-family:'DM Mono',monospace;font-size:11px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:9999}
.copied-toast.show{opacity:1}
.leaflet-control-attribution{background:rgba(20,18,16,.7) !important;color:var(--dust) !important;font-size:9px !important}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:rgba(139,127,114,.3);border-radius:2px}
</style>

<body>
 
<div class="topbar">
  <div><div class="topbar-title">7 Peaks · 6 Days</div><div class="topbar-sub">Utah County Wasatch</div></div>
  <div id="progress-mini" style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--summit)">0/7</div>
</div>
 
<div class="page active" id="list-page">
  <!-- DOWNLOAD BANNER -->
  <div class="dl-banner">
    <div class="dl-banner-title">📥 Offline Map Download</div>
    <div class="dl-banner-sub">Do this once at home on WiFi the night before you start. Takes 3–5 minutes. Maps will work with no service on the mountain.</div>
    <button class="dl-btn" id="dl-all-btn" onclick="downloadAll()">⬇ Download All 6 Trail Maps</button>
    <div class="dl-progress-wrap" id="dl-progress-wrap">
      <div class="dl-progress-label"><span id="dl-status">Starting...</span><span id="dl-pct">0%</span></div>

    <div class="s-stat"><div class="s-num">6</div><div class="s-lbl">Days</div></div>
    <div class="s-stat"><div class="s-num">11,933</div><div class="s-lbl">Max Elev</div></div>

</div>
 
<div class="page" id="detail-page"></div>
 
<div class="bottom-nav">
  <button class="nav-btn active" id="nav-list" onclick="showPage('list')">
    <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>Days
  </button>

    <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>Map
  </button>
</div>
 
<div class="copied-toast" id="toast">Copied!</div>
 
<script>
// ================================================================
// SERVICE WORKER — registers inline so no separate .js file needed
// This is what makes maps TRULY persist offline in Safari
// ================================================================
const SW_CODE = `
const CACHE = 'peaks-v1';
self.addEventListener('install', e => { self.skipWaiting(); });
self.addEventListener('activate', e => { e.waitUntil(self.clients.claimAll()); });
self.addEventListener('fetch', e => {
  const url = e.request.url;
  if(url.includes('tile.opentopomap.org') || url.includes('openstreetmap.org')) {
    e.respondWith(
      caches.open(CACHE).then(cache =>
        cache.match(e.request).then(cached => {
          if(cached) return cached;
          return fetch(e.request).then(resp => {
            if(resp && resp.status === 200) cache.put(e.request, resp.clone());
            return resp;
          }).catch(() => new Response('', {status: 503}));
        })
      )
    );
  }
});
`;
 
// Register service worker from blob URL
if('serviceWorker' in navigator) {
  const blob = new Blob([SW_CODE], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl, {scope:'/'}).then(reg => {
    console.log('SW registered');
  }).catch(err => {
    console.log('SW registration failed (normal for file://):', err);
    // Fall back to Cache API directly
  });
}
 
// ================================================================
// TILE DOWNLOAD SYSTEM
// Uses both Service Worker cache AND Cache API as backup
// ================================================================
const CACHE_NAME = 'peaks-tiles-v1';
 
function lon2tile(lon,z){return Math.floor((lon+180)/360*Math.pow(2,z))}
function lat2tile(lat,z){return Math.floor((1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*Math.pow(2,z))}
 
function getTilesForBounds(minLat,maxLat,minLng,maxLng,zooms){
  const tiles=[];
  const servers=['a','b','c'];
  zooms.forEach(z=>{
    const x0=lon2tile(minLng,z), x1=lon2tile(maxLng,z);
    const y0=lat2tile(maxLat,z), y1=lat2tile(minLat,z);
    for(let x=x0;x<=x1;x++){
      for(let y=y0;y<=y1;y++){
        const s=servers[(x+y)%3];
        tiles.push(`https://${s}.tile.opentopomap.org/${z}/${x}/${y}.png`);
      }
    }
  });
  return tiles;
}
 
function getRouteTiles(route){
  const lats=route.map(r=>r[0]), lngs=route.map(r=>r[1]);
  const pad=0.03;
  return getTilesForBounds(
    Math.min(...lats)-pad, Math.max(...lats)+pad,
    Math.min(...lngs)-pad, Math.max(...lngs)+pad,
    [11,12,13,14,15] // zooms: overview → trail detail
  );
}
 
async function downloadTile(url){
  // Try Cache API first (most reliable across Safari versions)
  try {
    const cache = await caches.open(CACHE_NAME);
    const existing = await cache.match(url);
    if(existing) return true;
    const resp = await fetch(url, {mode:'cors'});
    if(resp.ok) { await cache.put(url, resp); return true; }
  } catch(e) {}
  // Fallback: just fetch so browser caches it
  try { await fetch(url, {mode:'no-cors', cache:'force-cache'}); } catch(e) {}
  return true;
}
 
let cachedPeaks = JSON.parse(localStorage.getItem('peaks_cached')||'[]');
let downloading = false;
 
async function downloadAll(){
  if(downloading) return;
  downloading = true;
  const btn = document.getElementById('dl-all-btn');
  const wrap = document.getElementById('dl-progress-wrap');
  const fill = document.getElementById('dl-fill');
  const status = document.getElementById('dl-status');
  const pct = document.getElementById('dl-pct');
  const dotsEl = document.getElementById('dl-peaks');
 
  btn.disabled = true;
  wrap.style.display = 'block';
 
  // Build dots
  dotsEl.innerHTML = PEAKS.map(p=>`<div class="dl-peak-dot ${cachedPeaks.includes(p.id)?'done':''}" id="dot-${p.id}">${p.name.split(' ')[0]}</div>`).join('');
 
  // Collect all tiles across all peaks
  let allTiles = [];
  PEAKS.forEach(p => {
    const tiles = getRouteTiles(p.route);
    allTiles.push({peakId: p.id, peakName: p.name, tiles});
  });
 
  let totalDone = 0;
  const totalTiles = allTiles.reduce((s,p)=>s+p.tiles.length,0);
 
  for(const peak of allTiles){
    status.textContent = `Downloading ${peak.peakName}...`;
    const dot = document.getElementById(`dot-${peak.peakId}`);
 
    // Download in batches of 6
    for(let i=0; i<peak.tiles.length; i+=6){
      const batch = peak.tiles.slice(i,i+6);
      await Promise.all(batch.map(url=>downloadTile(url)));
      totalDone += batch.length;
      const p = totalDone/totalTiles;
      fill.style.width = (p*100).toFixed(1)+'%';
      pct.textContent = Math.round(p*100)+'%';
      await new Promise(r=>setTimeout(r,20)); // let UI breathe
    }
 
    // Mark peak as cached
    if(!cachedPeaks.includes(peak.peakId)){
      cachedPeaks.push(peak.peakId);
      localStorage.setItem('peaks_cached', JSON.stringify(cachedPeaks));
    }
    if(dot) dot.className='dl-peak-dot done';
    renderList();
  }
 
  status.textContent = '✓ All maps saved for offline use';
  pct.textContent = '100%';
  btn.textContent = '✓ All 6 Maps Downloaded';
  btn.className = 'dl-btn done';
  btn.disabled = false;
  downloading = false;
}
 
// ================================================================
// TRAIL DATA — all 6 trails, verified trailheads and routes
// ================================================================
const PEAKS = [
  // ── MONDAY: LOAFER MOUNTAIN ──────────────────────────────
  {id:0, day:'Monday', dayNum:1,
   name:'Loafer Mountain', subtitle:'& Santaquin Peak',
   miles:11.6, elevGain:4400, summitElev:10700, start:'6:00 AM', scramble:false,
   trailhead:{lat:39.9408,lng:-111.6441,elev:7716,label:'Loafer Mtn TH — Nebo Loop Rd (before Payson Lakes turnoff)'},
   summit:{lat:39.9833,lng:-111.6237,elev:10685},
   route:[
     [39.9408,-111.6441],[39.9415,-111.6418],[39.9440,-111.6400],
     [39.9480,-111.6390],[39.9490,-111.6382],[39.9530,-111.6350],
     [39.9580,-111.6320],[39.9630,-111.6310],[39.9679,-111.6300],
     [39.9710,-111.6270],[39.9760,-111.6255],[39.9833,-111.6237],
   ],
   waypoints:[
     {type:'start',label:'Loafer Mtn Trailhead',lat:39.9408,lng:-111.6441,elev:'7,716 ft',
      note:'Gravel parking on LEFT off Nebo Loop Rd, just before Payson Lakes turnoff. Signed "Loafer Mtn TR. 098". No fee, no bathroom.'},
     {type:'mid',label:'Blackhawk Trail Junction',lat:39.9415,lng:-111.6418,elev:'7,706 ft',
      note:'0.14mi in — STAY STRAIGHT on Loafer Mtn Trail. Do NOT turn right onto Blackhawk Trail.'},
     {type:'mid',label:'Bennie Creek Junction',lat:39.9480,lng:-111.6390,elev:'~7,800 ft',
      note:'STAY STRAIGHT through the trees, do not cross fence. Cross small creek. Then 0.1mi later TURN RIGHT onto the Loafer Mtn Trail. Signs present.'},
     {type:'mid',label:'Ridge Saddle',lat:39.9679,lng:-111.6300,elev:'~9,500 ft',
      note:'3.4mi in. Views of Payson Lakes below, Mt Nebo to south. Trail continues NW to Santaquin. Loafer Mountain is off-trail scramble RIGHT up the ridge spine from here.'},
     {type:'summit',label:'Santaquin Peak',lat:39.9833,lng:-111.6237,elev:'10,612 ft',
      note:'Trail goes around WEST side of Loafer to reach Santaquin. Better views than Loafer. Return same way back to TH.'},
   ],
   alerts:[
     {type:'warn',title:'Two Tricky Junctions Early On',body:'At Blackhawk: stay straight. At Bennie Creek: stay straight through trees, cross creek, then TURN RIGHT 0.1mi later. Easy to miss.'},
     {type:'warn',title:'No Water — Bring 3+ Liters',body:'Exposed hot ridge. No water sources on entire route. Start early to beat the heat.'},
   ],
   alltrails:'https://www.alltrails.com/trail/us/utah/loafer-mountain-and-santaquin-peak-trail'},
 
  // ── TUESDAY: LONE PEAK ────────────────────────────────────

// ================================================================
// APP STATE + RENDER
// ================================================================
let currentPage='list', mainMap=null, detailMaps={};
let completed = JSON.parse(localStorage.getItem('peaks_done')||'[]');
 
function renderList(){
  const list = document.getElementById('day-list');
  list.innerHTML = '';
  let allCached = true;
  PEAKS.forEach(p=>{
    const done = completed.includes(p.id);
    const cached = cachedPeaks.includes(p.id);
    if(!cached) allCached = false;
    const div = document.createElement('div');
    div.className = 'day-item';
    div.onclick = ()=>showDetail(p.id);
    div.innerHTML = `
      <div class="day-num-col" style="${done?'color:rgba(61,107,79,.6)':''}">${String(p.dayNum).padStart(2,'0')}</div>
      <div class="day-info">
        <div class="day-label-sm">${p.day}${done?' · ✓ Done':''}${cached?' · 📥':''}</div>
        <div class="day-name" style="${done?'color:var(--pine)':''}">${p.name}</div>
        <div class="tag-row">
          <span class="tag tag-mi">${p.miles} mi</span>
          <span class="tag tag-elev">${p.summitElev.toLocaleString()} ft</span>
          <span class="tag tag-time">${p.start}</span>
          ${p.scramble?'<span class="tag tag-hard">⚡ Scramble</span>':''}
        </div>
      </div>
      <div class="day-chevron">›</div>`;
    list.appendChild(div);
  });
  document.getElementById('progress-mini').textContent = completed.length+'/7';
 
  // Update download btn
  const btn = document.getElementById('dl-all-btn');
  if(allCached && btn){
    btn.textContent = '✓ All 6 Maps Downloaded';
    btn.className = 'dl-btn done';
  }
  // Update dots
  PEAKS.forEach(p=>{
    const dot = document.getElementById(`dot-${p.id}`);
    if(dot && cachedPeaks.includes(p.id)) dot.className='dl-peak-dot done';
  });
}
 
function showDetail(id){
  const p = PEAKS[id];
  const done = completed.includes(p.id);
  const cached = cachedPeaks.includes(p.id);
  const page = document.getElementById('detail-page');
 
  const aHtml = p.alerts.map(a=>`
    <div class="${a.type==='warn'?'alert-card':'info-card'}">
      <div class="${a.type==='warn'?'alert-title':'info-title'}">${a.title}</div>
      <div class="${a.type==='warn'?'alert-body':'info-body'}">${a.body}</div>
    </div>`).join('');
 
  const wHtml = p.waypoints.map(w=>`
    <div class="waypoint">
      <div class="wp-dot ${w.type}">${w.type==='start'?'🚗':w.type==='summit'?'🏔':w.type==='end'?'🅿':'📍'}</div>
      <div class="wp-info">
        <div class="wp-name">${w.label}</div>
        <div class="wp-elev">${w.elev}</div>
        <div class="wp-coords" onclick="copyCoords(${w.lat},${w.lng})">📋 ${w.lat.toFixed(4)}, ${w.lng.toFixed(4)}</div>
        <div class="wp-note">${w.note}</div>
      </div>
    </div>`).join('');
 
  const apple = `https://maps.apple.com/?daddr=${p.trailhead.lat},${p.trailhead.lng}&dirflg=d`;
  const google = `https://www.google.com/maps/dir/?api=1&destination=${p.trailhead.lat},${p.trailhead.lng}&travelmode=driving`;
 
  page.innerHTML = `
    <div class="detail-header">
      <div class="detail-back" onclick="backToList()">‹ All Days</div>
      <div class="detail-day-lbl">Day ${p.dayNum} · ${p.day}</div>
      <div class="detail-peak-name">${p.name}</div>
      <div class="detail-tags">
        <span class="tag tag-mi">${p.miles} mi</span>
        <span class="tag tag-elev">${p.elevGain.toLocaleString()} ft gain</span>
        <span class="tag tag-time">${p.start} start</span>
        <span class="tag tag-elev">Summit: ${p.summitElev.toLocaleString()} ft</span>
        ${p.scramble?'<span class="tag tag-hard">⚡ Scramble</span>':''}
      </div>
    </div>
    <div class="status-toggle" onclick="toggleDone(${p.id})">
      <div class="status-check ${done?'done':''}">${done?'✓':''}</div>
      <div class="status-text">${done?'Summited! ✓':'Mark as completed'}
        <small>${done?'Tap to unmark':'Tap after you summit'}</small>
      </div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">
        Trail Map · Follow the Orange Line
        <span style="font-size:9px;color:${cached?'var(--pine)':'var(--dust)'}">${cached?'📥 Offline Ready':'No service = no map'}</span>
      </div>
      <div class="mini-map" id="dm-${p.id}"></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <a href="${apple}" class="open-maps-btn" style="flex:1">🗺 Apple Maps TH</a>
        <a href="${google}" class="open-maps-btn" style="flex:1">📍 Google Maps TH</a>
      </div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Important Notes</div>
      ${aHtml}
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Waypoints · Tap coords to copy</div>
      <div class="waypoint-list">${wHtml}</div>
    </div>
    <div class="detail-section" style="border-bottom:none">
      <a href="${p.alltrails}" class="open-maps-btn" target="_blank">↗ View on AllTrails</a>
    </div>`;
 
  showPage('detail');
  // Double RAF + timeout = most reliable Safari map init
  requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(()=>initDetailMap(p), 150)));
}
 
function initDetailMap(p){
  const el = document.getElementById(`dm-${p.id}`);
  if(!el || detailMaps[p.id]) return;
 
  // Force explicit size — critical for Safari
  el.style.height = '280px';
  el.style.width = '100%';
  el.style.display = 'block';
  el.style.position = 'relative';
 
  const lats = p.route.map(r=>r[0]);
  const lngs = p.route.map(r=>r[1]);
  const bounds = [[Math.min(...lats),Math.min(...lngs)],[Math.max(...lats),Math.max(...lngs)]];
 
  // Create map without initial view — set after invalidateSize
  const m = L.map(el, {
    zoomControl: false,
    attributionControl: false,
    preferCanvas: true,
    fadeAnimation: false,
    zoomAnimation: false,
  });
 
  // Add tile layer — pulls from Cache API if offline
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    maxZoom: 17,
    opacity: 0.92,
    crossOrigin: true,
  }).addTo(m);
 
  // Bold orange trail line
  L.polyline(p.route, {color:'rgba(232,82,42,.3)', weight:14, opacity:.5, lineCap:'round', lineJoin:'round'}).addTo(m);
  L.polyline(p.route, {color:'#ff6b3d', weight:4, opacity:1, lineCap:'round', lineJoin:'round'}).addTo(m);
 
  // Green TH marker
  const thIcon = L.divIcon({html:'<div style="background:#3d6b4f;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.8)"></div>',className:'',iconSize:[16,16],iconAnchor:[8,8]});
  L.marker([p.trailhead.lat,p.trailhead.lng],{icon:thIcon}).addTo(m)
    .bindPopup(`<b>START: Trailhead</b><br><small>${p.trailhead.label}</small>`);
 
  // Orange summit marker
  const sIcon = L.divIcon({html:'<div style="background:#e8522a;width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 10px rgba(232,82,42,.9)"></div>',className:'',iconSize:[20,20],iconAnchor:[10,10]});
  L.marker([p.summit.lat,p.summit.lng],{icon:sIcon}).addTo(m)
    .bindPopup(`<b>🏔 ${p.name} Summit</b><br><small>${p.summitElev.toLocaleString()} ft</small>`);
 
  // Blue shuttle end marker for Cascade/Provo
  if(p.id===3){
    const eIcon = L.divIcon({html:'<div style="background:#4a8fa8;width:16px;height:16px;border-radius:3px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.8)"></div>',className:'',iconSize:[16,16],iconAnchor:[8,8]});
    L.marker([40.2424,-111.5777],{icon:eIcon}).addTo(m)
      .bindPopup('<b>🅿 Shuttle Car TH (END)</b><br><small>40.2424, -111.5777</small>');
  }
 
  detailMaps[p.id] = m;
 
  // Safari needs multiple invalidation passes to render correctly
  const fixMap = () => { m.invalidateSize(true); m.fitBounds(bounds, {padding:[30,30], animate:false}); };
  fixMap();
  setTimeout(fixMap, 200);
  setTimeout(fixMap, 500);
  setTimeout(fixMap, 1000);
}
 
function initMainMap(){
  if(mainMap) return;
  const el = document.getElementById('main-map');
  if(!el) return;
 
  mainMap = L.map(el, {
    zoomControl: true,
    attributionControl: true,
    preferCanvas: true,
    fadeAnimation: false,
    zoomAnimation: false,
  });
 
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    maxZoom: 17,
    attribution: '© OpenTopoMap',
    crossOrigin: true,
  }).addTo(mainMap);
 
  PEAKS.forEach(p=>{
    const done = completed.includes(p.id);
    // Trail line
    L.polyline(p.route, {color:done?'rgba(61,107,79,.7)':'rgba(232,82,42,.6)', weight:3, lineCap:'round'}).addTo(mainMap);
    // Summit numbered marker
    const icon = L.divIcon({
      html:`<div style="background:${done?'#3d6b4f':'#e8522a'};width:36px;height:36px;border-radius:50%;border:3px solid #f0ece6;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:16px;color:#fff;box-shadow:0 2px 14px rgba(${done?'61,107,79':'232,82,42'},.8)">${p.dayNum}</div>`,
      className:'', iconSize:[36,36], iconAnchor:[18,18]
    });
    L.marker([p.summit.lat,p.summit.lng],{icon}).addTo(mainMap)
      .bindPopup(`<div class="popup-day">Day ${p.dayNum} · ${p.day}</div><div class="popup-name">${p.name}</div><div class="popup-info">${p.miles} mi · ${p.summitElev.toLocaleString()} ft · ${p.start}</div><a class="popup-btn" onclick="showDetail(${p.id});return false">View Route →</a>`);
    // TH blue dot
    L.circleMarker([p.trailhead.lat,p.trailhead.lng],{radius:5,color:'#4a8fa8',fillColor:'#4a8fa8',fillOpacity:.9,weight:1.5}).addTo(mainMap)
      .bindPopup(`<div class="popup-day">Trailhead · ${p.name}</div><div class="popup-info">${p.trailhead.label}</div>`);
  });
 
  const fixMain = () => { mainMap.invalidateSize(true); mainMap.setView([40.10,-111.65], 10, {animate:false}); };
  fixMain();
  setTimeout(fixMain, 300);
  setTimeout(fixMain, 800);
}
 
function toggleDone(id){
  completed = completed.includes(id) ? completed.filter(x=>x!==id) : [...completed,id];
  localStorage.setItem('peaks_done', JSON.stringify(completed));
  renderList();
  showDetail(id);
}
 
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  currentPage = name;
  if(name==='list'){
    document.getElementById('list-page').classList.add('active');
    document.getElementById('nav-list').classList.add('active');
  } else if(name==='map'){
    document.getElementById('map-page').classList.add('active');
    document.getElementById('nav-map').classList.add('active');
    requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(initMainMap,100)));
  } else if(name==='detail'){
    document.getElementById('detail-page').classList.add('active');
  }
}
 
function backToList(){ showPage('list'); }
 
function copyCoords(lat,lng){
  const s = `${lat},${lng}`;
  if(navigator.clipboard){ navigator.clipboard.writeText(s); }
  else {
    const t = document.createElement('textarea');
    t.value = s; document.body.appendChild(t); t.select();
    document.execCommand('copy'); document.body.removeChild(t);
  }
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 1800);
}
 
// Init
renderList();
</script>
